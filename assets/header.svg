<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gonzalo Munoz — Senior Full-Stack and Founding Engineer">
  <defs>
    <radialGradient id="glow" cx="22%" cy="32%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#10b981" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="92%" cy="88%" r="55%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#1f2937" fill-opacity="0.5"/>
    </pattern>
  </defs>

  <!-- canvas -->
  <rect width="1200" height="300" rx="18" fill="#050505"/>
  <rect width="1200" height="300" rx="18" fill="url(#dots)"/>
  <rect width="1200" height="300" rx="18" fill="url(#glow)"/>
  <rect width="1200" height="300" rx="18" fill="url(#glow2)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="298.5" rx="17.25" fill="none" stroke="#1f2937" stroke-opacity="0.7" stroke-width="1.5"/>

  <!-- name -->
  <text x="70" y="124" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="76" font-weight="700" fill="#fafafa" letter-spacing="-1">Gonzalo Muñoz</text>

  <!-- role -->
  <text x="74" y="166" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="27" font-weight="600" fill="#10b981" letter-spacing="0.3">Senior Full-Stack &amp; Founding Engineer</text>

  <!-- accent rule -->
  <rect x="74" y="188" width="360" height="2" fill="url(#rule)"/>

  <!-- terminal one-liner -->
  <text x="74" y="231" font-family="'SF Mono','Courier New',monospace" font-size="18" fill="#94a3b8"><tspan fill="#10b981">~ $</tspan> I turn complex problems into products people love to use.</text>
</svg>
